  /* Joko-pantaila bakarra: gai ilunean eta argian berdin, nahita. */
  :root {
    color-scheme: dark;
    --void: #05060d;
    --panel: #0c0e1b;
    --line: #23284a;
    --ink: #e6ebff;
    --dim: #8a93bd;
    --faint: #5a6390;
    --amber: #dcab66;
    --sky: #93cfe0;
    --rose: #d47a9f;
    --danger: #f0515f;
    --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; background: var(--void); color: var(--ink); }
  body { font-family: var(--f-display); padding-inline: 16px; padding-block: 16px; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .stage {
    position: relative; max-width: 100%;
    width: min(100%, calc((100vh - 32px) * 16 / 9));
    width: min(100%, calc((100dvh - 32px) * 16 / 9));
    aspect-ratio: 16 / 9; background: #000;
    border-radius: 6px; overflow: hidden; container-type: inline-size;
    box-shadow: 0 30px 90px -30px rgba(0, 0, 0, .9), 0 0 0 1px #151830;
    outline: none; touch-action: none;
  }
  .stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fallback[hidden] { display: none; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--dim); font-family: var(--f-mono); font-size: 14px; line-height: 1.5; }

  /* Joko-menua */
  .menu { position: absolute; left: 7%; bottom: 5%; width: min(46%, 520px); display: flex; flex-direction: column; gap: .5em;
    font-size: clamp(11px, 1.55cqw, 19px); user-select: none; -webkit-user-select: none; }
  .menu[hidden] { display: none; }
  .menu.center { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: min(78%, 560px); max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
    background: rgba(6, 8, 15, .86); border: 1px solid #23284a; border-radius: 8px; padding: 1.6em 1.8em; }
  .menu.right { left: auto; right: 6%; bottom: 8%; width: min(40%, 420px); }
  .menu .mtitle { margin: 0 0 .2em; font-weight: 700; font-size: 1.9em; letter-spacing: .22em; color: var(--ink); }
  .menu .msub { margin: 0 0 .6em; font-family: var(--f-mono); font-size: .78em; color: var(--dim); letter-spacing: .04em; }
  .menu ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .05em; }
  .menu .mi { all: unset; box-sizing: border-box; display: flex; align-items: baseline; gap: .8em; width: 100%; padding: .27em .6em .27em 1.4em;
    position: relative; cursor: pointer; font-weight: 600; letter-spacing: .14em; color: rgba(214, 222, 250, .62); border-radius: 4px; }
  .menu .mi::before { content: ""; position: absolute; left: .45em; top: 50%; width: .45em; height: .45em; margin-top: -.22em; transform: rotate(45deg); background: var(--amber); opacity: 0; }
  .menu .mi.sel { color: var(--ink); background: linear-gradient(90deg, rgba(220, 171, 102, .16), rgba(220, 171, 102, 0)); }
  .menu .mi.sel::before { opacity: 1; }
  .menu .mi .val { margin-left: auto; font-family: var(--f-mono); font-weight: 700; letter-spacing: 0; color: var(--amber); white-space: nowrap; display: inline-flex; gap: .5em; align-items: baseline; }
  .menu .mi:not(.sel) .val { color: rgba(220, 171, 102, .6); }
  .menu .arr { padding: 0 .25em; opacity: .55; }
  .menu .mi.sel .arr { opacity: 1; }
  .menu .arr:hover { color: var(--ink); }
  .menu .mhint { margin: .35em 0 0 1.4em; min-height: 1.3em; font-family: var(--f-mono); font-size: .74em; color: var(--dim); line-height: 1.45; }
  .menu .mbook { max-width: 34em; margin-bottom: .9em; font-size: .86em; line-height: 1.55; color: var(--dim); }
  .menu .mbook p { margin: 0 0 .7em; }
  .menu.wide { width: min(88%, 820px); }
  .menu .mbook.small { max-width: none; font-size: .76em; line-height: 1.45; }
  .menu .mbook.small p { margin: 0 0 .45em; }
  .menu .mbook.small .mbook-by { margin: .5em 0 .1em; font-size: .88em; }
  .menu .mbook em { font-style: normal; color: var(--ink); }
  .menu .mbook .mbook-name { margin: 0; font-size: 1.5em; font-weight: 700; letter-spacing: .08em; color: var(--rose); }
  .menu .mbook .mbook-by { margin: 0 0 1em; font-family: var(--f-mono); font-size: .85em; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
  .menu .mi.link .ext { margin-left: .2em; color: var(--amber); }
  .menu .mi:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .menu table { border-collapse: collapse; font-size: .8em; margin-bottom: .6em; width: 100%; }
  .menu th { text-align: left; padding: .7em .6em .25em 0; font-size: .82em; letter-spacing: .18em; color: var(--amber); font-weight: 700; }
  .menu td { padding: .22em .8em .22em 0; color: var(--dim); vertical-align: top; }
  .menu td:first-child { color: var(--ink); font-family: var(--f-mono); white-space: nowrap; }
  @container (max-width: 640px) {
    .menu { left: auto; right: 4%; top: 6%; bottom: auto; width: 50%; font-size: 11px; }
    .menu .mhint { display: none; }
    .menu.center { right: auto; width: 88%; padding: 1em 1.2em; max-height: 92%; overflow: auto; }
    .menu.right { top: auto; bottom: 6%; }
  }

  /* Ukipen-kontrolak (gailu ukikorretan bakarrik) */
  .touch { display: none; width: min(100%, 900px); justify-content: space-between; gap: 12px; user-select: none; -webkit-user-select: none; }
  .touch .grp { display: flex; gap: 8px; flex-wrap: wrap; }
  .touch button {
    font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; min-width: 54px; height: 54px; padding: 0 10px; touch-action: none;
  }
  .touch button.a { border-color: var(--rose); }
  .touch button.b { border-color: var(--sky); }
  .touch button:active { transform: scale(.95); }
  @media (pointer: coarse) {
    .touch { display: flex; }
    .stage { width: min(100%, calc((100vh - 110px) * 16 / 9)); width: min(100%, calc((100dvh - 110px) * 16 / 9)); }
  }
  @media (prefers-reduced-motion: reduce) { .touch button:active { transform: none; } }
  /* Hasierako atea: nabigatzaileek soinua lehen elkarrekintzaren ondoren bakarrik uzten dute */
  .gate { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1em;
    background: radial-gradient(ellipse at 50% 55%, #0d1a1c 0%, #04050a 70%); cursor: pointer; font-size: clamp(11px, 1.6cqw, 20px); user-select: none; -webkit-user-select: none; transition: opacity .45s; }
  .gate[hidden] { display: none; }
  .gate.out { opacity: 0; pointer-events: none; }
